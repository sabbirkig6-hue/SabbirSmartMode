
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABBIR SMART MODE</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef7f0;
    color: #173b27;
    text-align: center;
}

.container {
    max-width: 450px;
    margin: 20px auto;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 4px 15px #0001;
}

h2 { color: #087b43; }

.status {
    background: #e5f5eb;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: none;
    border-radius: 10px;
    background: #078344;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.stop { background: #b52b2b; }
.test { background: #2866a5; }
.gray { background: #555; }

.note {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

    <h2> SABBIR SMART MODE </h2>
    <p>অফলাইন স্মার্ট সাইলেন্ট ব্যবস্থা</p>

    <div class="status" id="status">
        অ্যাপ প্রস্তুত
    </div>

    <button onclick="requestDnd()">
        DND অনুমতি দিন
    </button>

    <button onclick="startMonitoring()">
        GPS পর্যবেক্ষণ চালু করুন
    </button>

    <button class="stop" onclick="stopMonitoring()">
        GPS পর্যবেক্ষণ বন্ধ করুন
    </button>

    <hr>

    <h3>সাউন্ড পরীক্ষা</h3>

    <button class="test" onclick="testSilent()">
        সাইলেন্ট পরীক্ষা
    </button>

    <button class="gray" onclick="restoreSound()">
        আগের সাউন্ড ফিরিয়ে দিন
    </button>

    <p id="gps">GPS পর্যবেক্ষণ এখনো পরীক্ষা করা হয়নি</p>

    <p class="note">
        সতর্কতা: GPS-এর নির্ভুলতা কমলেই ভবনের ভেতরে প্রবেশ নিশ্চিত হয় না।
        এই সংস্করণটি পরীক্ষামূলক। ভুল করে সাইলেন্ট হতে পারে।
    </p>

    <p class="note">Developer: Sabbir Ahmed</p>

</div>

<script>

function showStatus(message) {
    document.getElementById("status").innerText = message;
}

function requestDnd() {
    if (window.PhoneControl) {
        PhoneControl.requestDndAccess();
        showStatus("DND অনুমতি সেটিংস খুলুন");
    } else {
        showStatus("ফোনের সংযোগ পাওয়া যায়নি");
    }
}

function startMonitoring() {
    if (window.PhoneControl) {
        PhoneControl.startMonitoring();
        showStatus("GPS পর্যবেক্ষণ চালুর অনুরোধ পাঠানো হয়েছে");
        document.getElementById("gps").innerText =
            "GPS পর্যবেক্ষণ চালুর চেষ্টা চলছে";
    } else {
        showStatus("ফোনের সংযোগ পাওয়া যায়নি");
    }
}

function stopMonitoring() {
    if (window.PhoneControl) {
        PhoneControl.stopMonitoring();
        showStatus("GPS পর্যবেক্ষণ বন্ধ করার অনুরোধ পাঠানো হয়েছে");
        document.getElementById("gps").innerText =
            "GPS পর্যবেক্ষণ বন্ধ";
    }
}

function testSilent() {
    if (!window.PhoneControl) return;

    if (!PhoneControl.isDndAccessGranted()) {
        showStatus("আগে DND অনুমতি দিন");
        return;
    }

    let result = PhoneControl.setDnd(true);
    showStatus(result ? "সাইলেন্ট পরীক্ষা সম্পন্ন" : "সাইলেন্ট করা যায়নি");
}

function restoreSound() {
    if (!window.PhoneControl) return;

    let result = PhoneControl.setDnd(false);
    showStatus(result ? "আগের সাউন্ড ফিরিয়ে দেওয়ার চেষ্টা হয়েছে"
                      : "সাউন্ড ফিরিয়ে দেওয়া যায়নি");
}

</script>

</body>
</html>
